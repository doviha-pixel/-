<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ערוץ הבלין</title>
<style>
:root{--blue:#2463eb;--ink:#17324f;--muted:#6f8194;--bg:#f7fbff;--card:#fff;--line:#dfeaf5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,"Noto Sans Hebrew",sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff 0%,#f6fbff 45%,#eef7ff 100%);min-height:100vh}
.wrap{width:min(1120px,92vw);margin:auto}header.hero{min-height:88vh;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden}.bubble{position:absolute;border-radius:999px;background:#dcebff;opacity:.75}.b1{width:240px;height:240px;right:-80px;top:80px}.b2{width:170px;height:170px;left:4%;bottom:90px;background:#e8ddff}.b3{width:90px;height:90px;left:22%;top:16%;background:#dff7ee}.hero-inner{position:relative;z-index:2}.brand{font-size:clamp(52px,9vw,112px);font-weight:900;letter-spacing:-3px;margin:0 0 18px;color:var(--blue)}.tag{font-size:clamp(20px,3vw,30px);color:var(--muted);margin-bottom:38px}.start{border:0;background:var(--blue);color:white;padding:18px 34px;border-radius:18px;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 14px 30px rgba(36,99,235,.22)}.arrow{display:block;font-size:34px;margin-top:12px}section#categories{padding:56px 0 90px}.section-title{text-align:center;font-size:38px;margin:0 0 10px}.section-sub{text-align:center;color:var(--muted);margin:0 0 34px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cat{border:1px solid var(--line);background:rgba(255,255,255,.9);border-radius:26px;padding:28px 22px;min-height:150px;box-shadow:0 10px 30px rgba(55,92,130,.08);cursor:pointer;text-align:right;transition:.2s}.cat:hover{transform:translateY(-4px)}.cat h3{font-size:25px;margin:0 0 10px}.cat p{margin:0;color:var(--muted);line-height:1.6}.cat .open{margin-top:18px;font-weight:800;color:var(--blue)}.category-page{display:none;min-height:100vh;padding:28px 0 70px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:35px}.back{border:1px solid var(--line);background:white;border-radius:14px;padding:12px 18px;cursor:pointer;color:var(--ink);font-weight:700}.mini-brand{font-weight:900;color:var(--blue);font-size:22px}.category-head{background:white;border:1px solid var(--line);border-radius:30px;padding:32px;margin-bottom:25px;box-shadow:0 10px 30px rgba(55,92,130,.08)}.category-head h1{font-size:clamp(38px,6vw,64px);margin:0 0 14px;color:var(--blue)}.subtitle{font-size:18px;color:#7255a8;margin-bottom:12px;font-weight:700}.description{font-size:20px;line-height:1.75;color:#425a72;white-space:pre-wrap}.description.empty{color:#94a5b5;font-style:italic}.movies-title{font-size:28px;margin:28px 0 16px}.movies{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.movie{background:white;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(55,92,130,.07)}.screen{aspect-ratio:16/9;border-radius:16px;background:linear-gradient(135deg,#eaf4ff,#dcecff);display:grid;place-items:center;margin-bottom:14px;border:1px solid #d9e8f7}.play{width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:26px;padding-right:3px}.movie h3{margin:0 0 8px;font-size:21px}.movie p{margin:0;color:var(--muted);line-height:1.5}.movie a{display:inline-block;margin-top:13px;color:var(--blue);font-weight:800;text-decoration:none}.empty-state{grid-column:1/-1;background:#fff;border:1px dashed #bfd3e7;border-radius:22px;padding:36px;text-align:center;color:var(--muted);font-size:19px}.admin-note{margin-top:30px;text-align:center;color:#8596a8;font-size:14px}footer{border-top:1px solid var(--line);padding:28px 0 42px;text-align:center;color:var(--muted)}.loading{text-align:center;padding:26px;color:var(--muted)}.error{background:#fff0f0;border:1px solid #ffcaca;color:#9d3434;padding:16px;border-radius:14px;text-align:center}
@media(max-width:850px){.grid,.movies{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.brand{letter-spacing:-1px}.grid,.movies{grid-template-columns:1fr}header.hero{min-height:78vh}.category-head{padding:24px 20px}.topbar{align-items:flex-start}.section-title{font-size:32px}}
</style>
</head>
<body>
<main id="home">
<header class="hero"><div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div><div class="hero-inner wrap"><h1 class="brand">ערוץ הבלין</h1><div class="tag">הסרטים, המשחקים והקליפים שלנו — במקום אחד</div><button class="start" onclick="document.getElementById('categories').scrollIntoView({behavior:'smooth'})">בוא נתחיל <span class="arrow">↓</span></button></div></header>
<section id="categories"><div class="wrap"><h2 class="section-title">מה בא לכם לראות?</h2><p class="section-sub">בחרו קטגוריה ונכנסים ישר לתוכן</p><div id="categoryGrid" class="grid"><div class="loading">טוען קטגוריות…</div></div></div></section>
<footer><div class="wrap"><strong>ערוץ הבלין</strong><br>תוכן בשבילכם</div></footer>
</main>
<main id="categoryPage" class="category-page"><div class="wrap"><div class="topbar"><button class="back" onclick="goHome()">← חזרה לכל הקטגוריות</button><div class="mini-brand">ערוץ הבלין</div></div><div id="categoryHead" class="category-head"></div><h2 class="movies-title">הסרטים בקטגוריה</h2><div id="movieGrid" class="movies"></div><div class="admin-note">עריכת תיאורים והוספת סרטים תיפתח רק במצב מנהל.</div></div></main>
<script>
const SB_URL="https://xckwiluizodplxisiiud.supabase.co";const SB_KEY="sb_publishable_iFQiLIlqAOHE5Cozl9EGbQ_jJKZVKbL";
const FALLBACK_CATEGORIES=[
{id:"fallback-matach",slug:"matach",title:"סרטי מטח",subtitle:"",description:""},
{id:"fallback-funny",slug:"funny",title:"סרטים מצחיקים",subtitle:"",description:""},
{id:"fallback-games",slug:"games",title:"משחקים",subtitle:"",description:""},
{id:"fallback-recent",slug:"recent",title:"סרטים שיצאו לאחרונה",subtitle:"",description:""},
{id:"fallback-add",slug:"you-can-add",title:"סרטים שאתם יכולים להוסיף",subtitle:"",description:""},
{id:"fallback-malima",slug:"malima",title:"סרטי מאלימא",subtitle:"מנדלה • ארי • לוי • יהודה • מושי • איטה",description:""},
{id:"fallback-clips",slug:"clips",title:"קליפים",subtitle:"",description:""}
];
let categories=[...FALLBACK_CATEGORIES],videos=[];
async function api(path){const res=await fetch(SB_URL+"/rest/v1/"+path,{headers:{apikey:SB_KEY}});if(!res.ok)throw new Error("טעינת הנתונים נכשלה");return res.json()}
async function loadData(){
renderCategories();
const initialSlug=new URLSearchParams(location.hash.replace(/^#/,"")).get("category");
if(initialSlug)openCategory(initialSlug,false);
try{
  const [remoteCategories,remoteVideos]=await Promise.all([
    api("havlin_categories?select=*&order=sort_order.asc"),
    api("havlin_videos?select=*&order=sort_order.asc,created_at.desc")
  ]);
  if(Array.isArray(remoteCategories)&&remoteCategories.length) categories=remoteCategories;
  if(Array.isArray(remoteVideos)) videos=remoteVideos;
  renderCategories();
  const slug=new URLSearchParams(location.hash.replace(/^#/,"")).get("category");
  if(slug)openCategory(slug,false);
}catch(e){
  console.warn("Using built-in categories because live data could not be loaded.",e);
}
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function renderCategories(){document.getElementById("categoryGrid").innerHTML=categories.map(c=>`<article class="cat" onclick="openCategory('${encodeURIComponent(c.slug)}')"><h3>${esc(c.title)}</h3>${c.subtitle?'<p>'+esc(c.subtitle)+'</p>':'<p>לחצו כדי להיכנס לקטגוריה</p>'}<div class="open">פתיחה ←</div></article>`).join("")}
function openCategory(encodedSlug,push=true){const slug=decodeURIComponent(encodedSlug),c=categories.find(x=>x.slug===slug);if(!c)return;if(push)history.pushState({category:slug},"","#category="+encodeURIComponent(slug));document.getElementById("home").style.display="none";document.getElementById("categoryPage").style.display="block";scrollTo(0,0);const desc=c.description&&c.description.trim()?esc(c.description):"כאן יופיע הטקסט שתכתוב על הקטגוריה הזאת.";const emptyClass=c.description&&c.description.trim()?"":" empty";document.getElementById("categoryHead").innerHTML=`<h1>${esc(c.title)}</h1>${c.subtitle?'<div class="subtitle">'+esc(c.subtitle)+'</div>':''}<div class="description${emptyClass}">${desc}</div>`;const rows=videos.filter(v=>v.category_id===c.id);document.getElementById("movieGrid").innerHTML=rows.length?rows.map(v=>`<article class="movie"><div class="screen"><div class="play">▶</div></div><h3>${esc(v.title)}</h3>${v.description?'<p>'+esc(v.description)+'</p>':''}${v.video_url?'<a href="'+esc(v.video_url)+'" target="_blank" rel="noopener">לצפייה בסרט ←</a>':''}</article>`).join(""):`<div class="empty-state">עדיין לא נוספו סרטים לקטגוריה הזאת.<br>כשנוסיף סרטים — הם יופיעו כאן בכרטיסים.</div>`}
function goHome(){history.pushState({},"",location.pathname);document.getElementById("categoryPage").style.display="none";document.getElementById("home").style.display="block";setTimeout(()=>document.getElementById("categories").scrollIntoView({behavior:"smooth"}),20)}
addEventListener("popstate",()=>{const slug=new URLSearchParams(location.hash.replace(/^#/,"")).get("category");if(slug)openCategory(slug,false);else{document.getElementById("categoryPage").style.display="none";document.getElementById("home").style.display="block"}});loadData();
</script>
</body></html>
